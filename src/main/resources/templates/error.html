<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>Erro</title>
</head>
<body>
<!-- Página genenerica para qualquer erro sem template específico (400, 405, 500...).
     Mostra apenas o código de status: nenhum detalhe interno. -->
<main class="container container--narrow">
    <h1>Ocorreu um erro</h1>
    <section class="card">
        <p>Não foi possível processar a sua solicitação (código <span th:text="${status}">500</span>).</p>
        <a class="btn" th:href="@{/}">Voltar ao início</a>
    </section>
</main>
</body>
</html>

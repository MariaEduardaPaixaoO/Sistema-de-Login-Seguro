<!DOCTYPE html>
<!--
  Layout base compartilhado. Cada página o utiliza assim:
    <html th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
  O título e o <main> da página são injetados aqui; cabeçalho e rodapé vêm de fragments/.
  Para trocar a estrutura visual do site inteiro, edite este arquivo e os fragments.
-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">Login Seguro</title>
    <!-- theme.css: apenas variáveis (cores, fontes, espaçamentos). app.css: componentes. -->
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <main class="container" th:replace="${content}">Conteúdo</main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

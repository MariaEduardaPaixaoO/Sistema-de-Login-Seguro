<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>Cadastro</title>
</head>
<body>
<main class="container container--narrow">
    <h1>Criar conta</h1>

    <!-- th:action inclui o token CSRF. As validações HTML abaixo são só conveniência:
         o servidor valida tudo novamente (RegistrationForm). -->
    <form class="card form" th:action="@{/register}" th:object="${form}" method="post">
        <div class="alert alert-error" role="alert" th:if="${#fields.hasErrors('*')}">
            Corrija os campos destacados e tente novamente.
        </div>

        <div class="form__group">
            <label for="name">Nome</label>
            <input type="text" id="name" th:field="*{name}"
                   required maxlength="100" autocomplete="name">
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Erro</p>
        </div>

        <div class="form__group">
            <label for="email">E-mail</label>
            <input type="email" id="email" th:field="*{email}"
                   required maxlength="254" autocomplete="username">
            <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Erro</p>
        </div>



        <div class="form__group">
            <label for="password">Senha</label>

            <div class="password-wrapper">
                <input type="password" id="password" th:field="*{password}"
                       required minlength="8" maxlength="64"
                       pattern="(?=.*[A-Za-zÀ-ÿ])(?=.*[0-9]).+"
                       title="Mínimo de 8 caracteres, com ao menos uma letra e um número."
                       autocomplete="new-password">

                <button type="button" class="password-toggle"
                        aria-label="Mostrar senha"
                        aria-pressed="false"
                        data-password-toggle="password">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7S18.5 19 12 19 2 12 2 12Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>

            <p class="hint">Mínimo de 8 caracteres, com ao menos uma letra e um número.</p>
            <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Erro</p>
            <p class="field-error" th:if="${#fields.hasErrors('passwordWithinHashLimit')}"
               th:errors="*{passwordWithinHashLimit}">Erro</p>
        </div>

            <p class="hint">Mínimo de 8 caracteres, com ao menos uma letra e um número.</p>
            <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Erro</p>
            <p class="field-error" th:if="${#fields.hasErrors('passwordWithinHashLimit')}"
               th:errors="*{passwordWithinHashLimit}">Erro</p>
        </div>


        <div class="form__group">
            <label for="confirmPassword">Confirmar senha</label>

            <div class="password-wrapper">
                <input type="password" id="confirmPassword"
                       th:field="*{confirmPassword}"
                       required maxlength="64"
                       autocomplete="new-password">

                <button type="button" class="password-toggle"
                        aria-label="Mostrar senha"
                        aria-pressed="false"
                        data-password-toggle="confirmPassword">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>

            <p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}"
               th:errors="*{confirmPassword}">Erro</p>
            <p class="field-error" th:if="${#fields.hasErrors('passwordConfirmed')}"
               th:errors="*{passwordConfirmed}">Erro</p>
        </div>

        <button type="submit" class="btn btn-primary">Cadastrar</button>
    </form>

    <p class="muted">Já tem conta? <a th:href="@{/login}">Entrar</a>.</p>

    <script th:src="@{/js/register.js}" defer></script>
    <script th:src="@{/js/password-toggle.js}" defer></script>
</main>
</body>
</html>
